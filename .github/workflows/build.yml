name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot build-essential perl clang unzip curl git
          bash -c "$(curl -fsSL https://githubusercontent.com)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build .deb package
        run: make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyCustomCanvas-deb
          path: packages/*.deb
